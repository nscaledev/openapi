      description: >-
        OpenID configuration used to discover authentication servers when
        hitting

        a protected endpoint.  This is returned to the client when an
        authorization

        error is encountered so they can discover how to authenticate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/openidProtectedResource"
          example:
            resource: https://endpoint.acme.com
            authorization_servers:
              - http://auth.acme.com
            scopes_supported:
              - openid
              - profile
              - email
            bearer_methods_supported:
              - header
