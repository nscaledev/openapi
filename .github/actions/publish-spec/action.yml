name: Publish OpenAPI spec
description: >
  Bundles, sanitizes, validates, and publishes a source service's OpenAPI
  spec into nscaledev/openapi at <service>/<version>/openapi.{yaml,json}.
  Call this from a main-push workflow with version: main, and from a
  tag-release workflow with version: ${{ github.ref_name }}. A release
  (any version other than "main") also updates <service>/latest/ — a
  stable path that always points at the newest release, so downstream
  docs can link to it once and never need updating. A no-op (no commit,
  exit 0) when the sanitized spec is unchanged from what's already
  published at <service>/main/.

inputs:
  service:
    description: Service id — the top-level folder name in nscaledev/openapi, e.g. "identity"
    required: true
  spec-path:
    description: Path to the raw OpenAPI spec, relative to the calling repo's checkout root
    required: true
  version:
    description: Target folder name — "main" for a main-branch push, or a vX.Y.Z release tag
    required: true
  token:
    description: Token with contents:write on the openapi-repo (a repo secret you provision, e.g. OPENAPI_PUBLISH_TOKEN)
    required: true
  openapi-repo:
    description: The repo to publish into
    required: false
    default: nscaledev/openapi

runs:
  using: composite
  steps:
    - name: Checkout nscaledev/openapi
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.openapi-repo }}
        token: ${{ inputs.token }}
        path: _openapi-publish
        fetch-depth: 0 # full history — needed to find latest/'s current version below

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "20"

    - name: Install nscaledev/openapi dependencies
      shell: bash
      working-directory: _openapi-publish
      run: npm ci

    - name: Bundle spec (dereference external $refs)
      shell: bash
      run: npx --yes @redocly/cli@2 bundle "${{ inputs.spec-path }}" -o "${{ runner.temp }}/bundled.yaml" --ext yaml

    - name: Sanitize
      shell: bash
      run: node _openapi-publish/scripts/sanitize.mjs "${{ runner.temp }}/bundled.yaml" "${{ runner.temp }}/sanitized.yaml" "${{ inputs.service }}"

    - name: Validate (lint + forbidden-string scan)
      shell: bash
      working-directory: _openapi-publish
      run: scripts/validate.sh "${{ runner.temp }}/sanitized.yaml"

    - name: Generate JSON
      shell: bash
      run: npx --yes @redocly/cli@2 bundle "${{ runner.temp }}/sanitized.yaml" -o "${{ runner.temp }}/sanitized.json" --ext json

    - name: Check if spec content changed
      id: check
      shell: bash
      run: |
        # Compares against <service>/main/ — the latest known-published state
        # — rather than the target version folder, which for a brand new
        # release tag never exists yet and would always look "changed".
        # This is what makes "only publish when the spec actually changed"
        # true for both main-pushes and releases, not just main-pushes.
        REFERENCE="_openapi-publish/${{ inputs.service }}/main/openapi.yaml"
        if [ -f "$REFERENCE" ] && diff -q "$REFERENCE" "${{ runner.temp }}/sanitized.yaml" > /dev/null; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Spec is unchanged from ${{ inputs.service }}/main — nothing to publish."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Write spec into place
      if: steps.check.outputs.changed == 'true'
      shell: bash
      run: |
        DEST="_openapi-publish/${{ inputs.service }}/${{ inputs.version }}"
        mkdir -p "$DEST"
        cp "${{ runner.temp }}/sanitized.yaml" "$DEST/openapi.yaml"
        cp "${{ runner.temp }}/sanitized.json" "$DEST/openapi.json"
        {
          echo "# ${{ inputs.service }} — ${{ inputs.version }}"
          echo
          echo "[Open in Swagger UI](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/${{ inputs.openapi-repo }}/main/${{ inputs.service }}/${{ inputs.version }}/openapi.yaml)"
          echo
          echo "- [openapi.yaml](openapi.yaml)"
          echo "- [openapi.json](openapi.json)"
        } > "$DEST/README.md"

    - name: Update latest/ if this release is the newest stable version
      if: steps.check.outputs.changed == 'true' && inputs.version != 'main'
      shell: bash
      working-directory: _openapi-publish
      run: |
        NEW="${{ inputs.version }}"

        # latest/ only ever tracks a plain vX.Y.Z. Prereleases (vX.Y.Z-rc1
        # etc.) are real releases in their own <version>/ folder, but never
        # become "latest" — sort -V has no idea that 1.0.0-rc1 should rank
        # *below* 1.0.0, and getting semver prerelease precedence right in
        # bash isn't worth it when "skip prereleases" is simpler and correct.
        if ! [[ "$NEW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "$NEW is a prerelease — not updating ${{ inputs.service }}/latest."
          exit 0
        fi

        # The current latest/ version comes from this repo's own commit
        # history (the last commit that touched <service>/latest), not from
        # the spec's own info.version — this repo's git log is already the
        # source of truth for what was published when, so there's nothing
        # extra to keep in sync. No prior commit means no prior release.
        CURRENT="$(git log -1 --format=%s -- "${{ inputs.service }}/latest" \
          | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' || echo "v0.0.0")"

        HIGHEST="$(printf '%s\n%s\n' "$CURRENT" "$NEW" | sort -V | tail -1)"
        if [ "$HIGHEST" = "$NEW" ]; then
          mkdir -p "${{ inputs.service }}/latest"
          cp "${{ inputs.service }}/${{ inputs.version }}/openapi.yaml" "${{ inputs.service }}/latest/openapi.yaml"
          cp "${{ inputs.service }}/${{ inputs.version }}/openapi.json" "${{ inputs.service }}/latest/openapi.json"
          {
            echo "# ${{ inputs.service }} — latest ($NEW)"
            echo
            echo "[Open in Swagger UI](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/${{ inputs.openapi-repo }}/main/${{ inputs.service }}/latest/openapi.yaml)"
            echo
            echo "- [openapi.yaml](openapi.yaml)"
            echo "- [openapi.json](openapi.json)"
          } > "${{ inputs.service }}/latest/README.md"
        else
          echo "${{ inputs.service }}/latest is already on $CURRENT, newer than $NEW — leaving it alone."
        fi

    - name: Write service-level README
      if: steps.check.outputs.changed == 'true'
      shell: bash
      working-directory: _openapi-publish
      run: |
        # Points at main/ and latest/ only, deliberately, not every version
        # folder — someone landing on <service>/ just wants "what's newest"
        # or "what's on main right now", not a full release index.
        {
          echo "# ${{ inputs.service }}"
          echo
          if [ -f "${{ inputs.service }}/latest/openapi.yaml" ]; then
            echo "- [latest](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/${{ inputs.openapi-repo }}/main/${{ inputs.service }}/latest/openapi.yaml) — the newest stable release"
          fi
          if [ -f "${{ inputs.service }}/main/openapi.yaml" ]; then
            echo "- [main](https://petstore.swagger.io/?url=https://raw.githubusercontent.com/${{ inputs.openapi-repo }}/main/${{ inputs.service }}/main/openapi.yaml) — what's currently on the main branch"
          fi
        } > "${{ inputs.service }}/README.md"

    - name: Commit and push
      if: steps.check.outputs.changed == 'true'
      shell: bash
      working-directory: _openapi-publish
      run: |
        git config user.name "nscale-openapi-bot"
        git config user.email "nscale-openapi-bot@users.noreply.github.com"
        git add "${{ inputs.service }}"
        git commit -m "publish(${{ inputs.service }}): ${{ inputs.version }}"

        for attempt in 1 2 3; do
          if git push origin HEAD:main; then
            echo "Published ${{ inputs.service }}/${{ inputs.version }}."
            exit 0
          fi
          echo "Push rejected (attempt $attempt/3) — another publish landed first. Rebasing and retrying."
          git fetch origin main
          git rebase origin/main
        done

        echo "::error::Failed to push after 3 attempts — competing publishes may be looping. Re-run this job."
        exit 1
