name: Deploy Pages

# Runs when site/ itself changes, or after a publish commit lands (so a
# first-ever publish for a brand new service — one with no prior specs/
# entry to begin with — still gets its Pages artifact refreshed once).
# Routine spec updates to an already-published service don't need this:
# reference.html/index.html fetch specs/ and index.json client-side, so
# those go live the moment the commit lands, no redeploy required.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "specs/**"
      - "index.json"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
