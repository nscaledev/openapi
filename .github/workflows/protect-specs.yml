name: Protect specs/

# specs/ is only ever supposed to be written by publish.yml, running as
# nscale-openapi-bot. Any PR touching specs/** from anyone else fails here —
# this is the actual enforcement; CODEOWNERS is a secondary signal.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail if this PR touches specs/ and wasn't opened by the bot
        run: |
          if [ "${{ github.event.pull_request.user.login }}" = "nscale-openapi-bot" ]; then
            echo "Opened by nscale-openapi-bot — allowed."
            exit 0
          fi

          CHANGED="$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q '^specs/'; then
            echo "::error::This PR modifies specs/, which is only ever written by the publish pipeline (see README.md). Hand edits aren't accepted — publish through the source service repo instead."
            exit 1
          fi

          echo "No specs/ changes — OK."
