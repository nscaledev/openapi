components:
  schemas:
    CatalogedModel:
      additionalProperties: false
      description: Procured model record served by the read-only Model Catalog.
      properties:
        context_length_tokens:
          anyOf:
            - minimum: 1
              type: integer
            - type: "null"
          description: Maximum context length in tokens.
          title: Context Length Tokens
        data_type:
          anyOf:
            - type: string
            - type: "null"
          description: Human-facing serving data type, such as 16 FP.
          title: Data Type
        description:
          anyOf:
            - type: string
            - type: "null"
          description: Human-facing model description.
          title: Description
        developer:
          anyOf:
            - type: string
            - type: "null"
          description: Model developer when supplied by model metadata or derivable from
            the model namespace.
          title: Developer
        display_name:
          default: ""
          description: Human-facing catalog model name, derived from model_name when not
            supplied by model metadata.
          title: Display Name
          type: string
        files_size_mb:
          anyOf:
            - minimum: 0
              type: number
            - type: "null"
          description: Total model file size in megabytes when supplied by catalog metadata.
          title: Files Size Mb
        last_updated_at:
          anyOf:
            - format: date-time
              type: string
            - type: "null"
          description: Date-time when the catalog metadata or backing model artifact set
            was last updated.
          title: Last Updated At
        licenses:
          description: License identifiers or names supplied by catalog metadata.
          items:
            type: string
          title: Licenses
          type: array
        model_name:
          description: Stable catalog key used by exact and prefix model-catalog lookups.
          title: Model Name
          type: string
        model_size:
          anyOf:
            - type: string
            - type: "null"
          description: Human-facing model size, such as 70B.
          title: Model Size
        model_type:
          anyOf:
            - type: string
            - type: "null"
          description: Human-facing model capability type.
          title: Model Type
        provenance:
          anyOf:
            - discriminator:
                mapping:
                  hugging_face: "#/components/schemas/HuggingFaceProvenance"
                propertyName: origin
              oneOf:
                - $ref: "#/components/schemas/HuggingFaceProvenance"
            - type: "null"
          description: Immutable upstream provenance for cards created by the procurement
            workflow.
          title: Provenance
        source:
          $ref: "#/components/schemas/Source"
        vendor:
          default: Nscale
          description: Model vendor. IMS-created catalog cards are vended by Nscale.
          title: Vendor
          type: string
      required:
        - model_name
        - source
      title: CatalogedModel
      type: object
    CatalogedModelPage:
      description: Paginated Model Catalog list response.
      properties:
        items:
          items:
            $ref: "#/components/schemas/CatalogedModel"
          title: Items
          type: array
        page:
          description: One-based page number requested by the caller.
          minimum: 1
          title: Page
          type: integer
        page_size:
          description: Maximum number of records returned per page.
          minimum: 1
          title: Page Size
          type: integer
        total:
          description: Total records matching the request before pagination.
          minimum: 0
          title: Total
          type: integer
        total_pages:
          description: Total pages available at the selected page size.
          minimum: 0
          title: Total Pages
          type: integer
      required:
        - items
        - total
        - page
