          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/resource-manager/internal/resource-pool-timeout-recovery/bind-run:
    post:
      tags:
        - resource-manager
      summary: Bind Internal Resource Pool Timeout Recovery Run
      description: Bind a CPO-validated Temporal run while the timed-out request
        retains its mutation lock.
      operationId: bind_internal_resource_pool_timeout_recovery_run_api_v1_resource_manager_internal_resource_pool_timeout_recovery_bind_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePoolTimeoutRecoveryRunBinding"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePoolTimeoutRecoveryResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/v1/resource-manager/internal/resource-pool-timeout-recovery/finalize:
    post:
      tags:
        - resource-manager
      summary: Finalize Internal Resource Pool Timed Out Request
      description: Finalize timeout only after the worker proves closure for the exact
        persisted run.
      operationId: finalize_internal_resource_pool_timed_out_request_api_v1_resource_manager_internal_resource_pool_timeout_recovery_finalize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePoolTimeoutRecoveryFinalizeRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePoolTimeoutRecoveryResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
