        - succeeded
        - failed
        - cancelled
      title: DeploymentPhase
      description: >-
        Known phase values for deployment and deployed-product lifecycle state.


        `queued`: the request is accepted and waiting for admission.

        `starting`: admission owns the request and runtime start is being
        established.

        `running`: the active attempt is in progress.

        `cancellation_pending`: cancellation has been requested and terminal
        exit is pending.

        `undeploying`: delete is actively removing the deployed product.

        `succeeded`: the request completed successfully.

        `failed`: the request completed with failure.

        `cancelled`: the request completed as cancelled.
