extends:
  - recommended
rules:
  # Not every service has a confirmed public base URL yet (see
  # scripts/public-servers.json) — several of Nscale's own specs don't carry
  # one today either. Warn rather than fail until that's tracked down
  # per-service; revisit as a hard error once every service has an entry.
  no-empty-servers: warn
  # Several source specs (ims, envir) don't declare `security` on every
  # operation — mostly health/liveness/readiness endpoints where that's
  # expected, but the gap isn't fully audited per-operation. This is a
  # source-repo spec-quality issue, not something this pipeline introduces
  # or can safely fix by fabricating a security scheme. Warn, don't block
  # publishing on it; flag to each service's own team to tighten up.
  security-defined: warn
  # uni-identity's source spec has one schema (jsonWebKey) typed as object
  # with an `items` field, which is only valid for arrays -- a pre-existing
  # bug in that repo's own spec, not introduced by sanitization. Warn so
  # the rest of an otherwise-valid spec isn't blocked from publishing.
  no-schema-type-mismatch: warn
