<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nscale API Reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Deliberately no style.css here — Scalar owns this whole page's layout
       and our landing-page reset/grid rules conflict with its own CSS. -->
</head>
<body>
  <div id="app">
    <main><p class="empty">Loading reference…</p></main>
  </div>
  <!-- Pinned deliberately — do not float @latest in production. Bump this
       version string by hand and re-verify rendering when upgrading. -->
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.63.0"></script>
  <script type="module">
    import { sanitizeServiceParam } from '/assets/app.js';

    const params = new URLSearchParams(location.search);
    const service = sanitizeServiceParam(params.get('service'));

    if (!service) {
      location.replace('/index.html');
    } else {
      Scalar.createApiReference('#app', {
        url: `/specs/${service}/openapi.yaml`,
        hideDownloadButton: false,
      });
    }
  </script>
</body>
</html>
